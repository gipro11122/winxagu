<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World in the Sky</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(
        to bottom,
        #087fe8 0%,
        #35aaf5 45%,
        #9cddff 100%
      );
      color: white;
    }

    .sky {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .sun {
      position: absolute;
      top: 8%;
      right: 12%;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #ffe66d;
      box-shadow:
        0 0 30px #ffe66d,
        0 0 80px rgba(255, 230, 109, 0.75);
    }

    .cloud {
      position: absolute;
      width: 170px;
      height: 55px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.8);
      filter: blur(1px);
      animation: drift 22s linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before {
      width: 75px;
      height: 75px;
      left: 25px;
      bottom: 15px;
    }

    .cloud::after {
      width: 100px;
      height: 100px;
      right: 20px;
      bottom: 10px;
    }

    .cloud-one {
      top: 19%;
      left: -220px;
    }

    .cloud-two {
      top: 70%;
      left: -300px;
      transform: scale(0.7);
      animation-delay: -10s;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 3rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 60px rgba(0, 40, 100, 0.25);
      backdrop-filter: blur(12px);
      animation: float 4s ease-in-out infinite;
    }

    .badge {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(3rem, 9vw, 7rem);
      line-height: 1;
      text-shadow: 0 5px 20px rgba(0, 50, 120, 0.3);
    }

    h1 span {
      color: #fff176;
    }

    p {
      margin-top: 1.25rem;
      font-size: clamp(1rem, 2vw, 1.3rem);
      opacity: 0.95;
    }

    .button {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.9rem 1.7rem;
      border: none;
      border-radius: 999px;
      background: #fff;
      color: #087fe8;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s ease;
      box-shadow: 0 8px 20px rgba(0, 50, 120, 0.2);
    }

    .button:hover {
      transform: translateY(-4px) scale(1.05);
      background: #fff176;
      color: #064d9b;
    }

    .plane {
      position: absolute;
      z-index: 1;
      top: 28%;
      left: -180px;
      font-size: 4rem;
      transform: rotate(-8deg);
      filter: drop-shadow(0 8px 8px rgba(0, 45, 100, 0.25));
      animation: fly 14s linear infinite;
    }

    .trail {
      position: absolute;
      width: 260px;
      height: 4px;
      top: 50%;
      right: 55px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      filter: blur(2px);
      transform: rotate(-8deg);
    }

    .birds {
      position: absolute;
      bottom: 17%;
      left: 15%;
      font-size: 2rem;
      letter-spacing: 12px;
      opacity: 0.55;
    }

    @keyframes fly {
      0% {
        left: -180px;
        top: 28%;
      }

      50% {
        top: 20%;
      }

      100% {
        left: calc(100% + 180px);
        top: 32%;
      }
    }

    @keyframes drift {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(calc(100vw + 500px));
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @media (max-width: 600px) {
      .content {
        width: 88%;
        padding: 2.5rem 1.25rem;
      }

      .sun {
        width: 80px;
        height: 80px;
      }

      .plane {
        font-size: 2.7rem;
      }
    }
  </style>
</head>

<body>
  <main class="sky">
    <div class="sun"></div>

    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>

    <div class="plane">
      ✈️
      <div class="trail"></div>
    </div>

    <div class="birds">⌁⌁⌁</div>

    <section class="content">
      <div class="badge">Welcome aboard</div>
      <h1>Hello <span>World!</span></h1>
      <p>A little code, a bright blue sky, and a plane headed toward adventure.</p>
      <a class="button" href="#start">Start Exploring ✨</a>
    </section>
  </main>
</body>
</html>
